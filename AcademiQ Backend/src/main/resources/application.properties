RegistrationRequest.javaspring.application.name=Software Project Management

spring.datasource.url=jdbc:mysql://localhost:3306/academic_project_management
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

file.upload-dir=Uploads

# PDF UPLOAD LIMITS
# Maximum size of an individual uploaded file
spring.servlet.multipart.max-file-size=10MB

# Maximum size of the complete multipart request
spring.servlet.multipart.max-request-size=11MB


spring.jpa.show-sql=true